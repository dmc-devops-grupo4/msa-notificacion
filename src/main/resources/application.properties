spring.application.name=notificaciones-api
server.port=8086

#Data Source Properties
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_notificaciones
spring.datasource.username=root
spring.datasource.password=

#JPA Properties
spring.jpa.database=MYSQL
spring.jpa.properties.hibernate.format_sql=TRUE
spring.jpa.hibernate.ddl-auto=none

#Thymeleaf 
spring.thymeleaf.cache=false

#Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/actuator/info
springdoc.swagger-ui.enabled=true

#Configuracion para envio de email
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=5c3c78dfbc0426
spring.mail.password=34b88832b6d730
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=true

#Eureka Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

#Kafka
spring.kafka.bootstrap-servers=localhost:9193
spring.kafka.consumer.group-id=miGrupo
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer = org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Nombre del topic en Kafka
topico.tramite-enviado=tramite-enviado-topico
topico.alerta-notificacion=alerta-notificacion-topico
topico.registro-persona=registro-persona-topico

# Nombre del servicio en Eureka
uri.service.persona=http://localhost:8084