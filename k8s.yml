apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-notificaciones
  namespace: mesa-partes
  labels:
    app: api-notificaciones
    env: ${ENV}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-notificaciones
  template:
    metadata:
      labels:
        app: api-notificaciones
        env: ${ENV}
    spec:
      containers:
        - name: api-notificaciones
          image: ${IMAGE}
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: mdpv-config
          env:
            - name: DB_URL
              value: "jdbc:mysql://$(DB_HOST):3306/db_notificaciones?sslMode=REQUIRED&serverTimezone=UTC"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mdpv-secrets
                  key: DB_PASSWORD
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mdpv-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mdpv-secrets
                  key: MAIL_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          # Margen de arranque de Spring Boot
          startupProbe:
            tcpSocket:
              port: 8086
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8086
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8086
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-notificaciones
  namespace: mesa-partes
spec:
  type: ClusterIP
  selector:
    app: api-notificaciones
  ports:
    - port: 8086
      targetPort: 8086
